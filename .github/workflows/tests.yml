name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pandas pytest
      # Module invocation keeps the repository root on sys.path so the
      # top-level pipeline modules can be imported during test collection.
      - run: python -m pytest -q
